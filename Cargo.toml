[package]
name = "jpcargo"
version = "0.1.4"
edition = "2021"
authors = ["jpcargo team"]
description = "Rust Japanese Diagnostic Cargo Wrapper - Rustコンパイラのエラーを分かりやすい日本語で診断するCargoラッパー"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "3.0"
regex = "1.10"
