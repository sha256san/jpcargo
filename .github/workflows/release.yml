name: Release Prebuilt Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: jpcargo
            archive_name: jpcargo-x86_64-unknown-linux-gnu.tar.gz

          # Linux ARM64 (aarch64 - Raspberry Pi 4/5, AWS Graviton, ARM VPS)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: jpcargo
            archive_name: jpcargo-aarch64-unknown-linux-gnu.tar.gz
            is_arm_linux: true

          # macOS Intel (x86_64)
          - target: x86_64-apple-darwin
            os: macos-13
            bin_name: jpcargo
            archive_name: jpcargo-x86_64-apple-darwin.tar.gz

          # macOS Apple Silicon (aarch64 - M1 / M2 / M3 / M4)
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: jpcargo
            archive_name: jpcargo-aarch64-apple-darwin.tar.gz

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: jpcargo.exe
            archive_name: jpcargo-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install ARM Linux cross-linker
        if: matrix.is_arm_linux
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
        shell: bash

      - name: Build binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target ${{ matrix.target }}
        shell: bash

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          tar -czvf ${{ matrix.archive_name }} -C target/${{ matrix.target }}/release ${{ matrix.bin_name }}
        shell: bash

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.bin_name }} -DestinationPath ${{ matrix.archive_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
